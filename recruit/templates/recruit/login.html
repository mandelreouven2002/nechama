{% extends "recruit/base.html" %}
{% block title %}כניסה{% endblock %}
{% block content %}
<div class="login-wrap card">
  <h1>נחמה · כניסת צוות</h1>
  {% if form.errors %}<div class="flash error">שם המשתמש או הסיסמה לא נכונים.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">שם משתמש</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus>
    <label for="id_password">סיסמה</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <p><button type="submit">כניסה</button></p>
  </form>
</div>
{% endblock %}
